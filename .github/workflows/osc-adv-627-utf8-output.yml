name: Issue 627 UTF-8 RED diagnostic

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Fork ref containing the issue-627 regression tests
        required: true
        type: string

jobs:
  issue-627-utf8-red-diagnostic:
    name: Issue 627 UTF-8 assertion-level RED diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out target ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Show checked-out provenance
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run issue-627 UTF-8 regression nodes
        run: uv run pytest tests/test_diff_pdf_cli.py::TestCli::test_html_output_uses_utf8_when_host_default_is_cp1252 tests/test_diff_bill.py::TestCompareLegacyTwoPathForm::test_html_output_uses_utf8_when_host_default_is_cp1252
